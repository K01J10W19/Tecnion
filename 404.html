<!doctype html>
<html lang="en">
  <head>
    <!-- @include head.html -->
    <title>Page Not Found | Technion</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/src/styles/pages/not-found.css" />
  </head>
  <body data-page="not-found">
    <!-- @include header.html -->

    <main id="main">
      <section class="section" aria-labelledby="page-title">
        <div class="not-found container">
          <p class="not-found__code enter" aria-hidden="true">404</p>
          <h1 class="title-section enter enter--1" id="page-title">Page not found</h1>
          <p class="lead text-muted enter enter--2">
            The page you're looking for doesn't exist or has moved.
          </p>
          <div class="cluster not-found__actions enter enter--3">
            <a class="btn btn--primary" href="/">
              <span class="btn__label">Go to the homepage</span>
              <svg class="icon btn__icon" aria-hidden="true" focusable="false">
                <use href="#icon-arrow-right"></use>
              </svg>
            </a>
            <a class="btn btn--outline" href="/contacts/">Contact us</a>
          </div>
        </div>
      </section>
    </main>

    <!-- @include footer.html -->
    <!-- @include order-dialog.html -->
  </body>
</html>
