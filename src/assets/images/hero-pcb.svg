<!-- Placeholder: replace with the production 3D render of the assembled board.
     Drawn top-down; the hero tilts it in 3D with CSS (pages/home.css). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25b3da" />
      <stop offset="0.55" stop-color="#1599c0" />
      <stop offset="1" stop-color="#0a7398" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#33444e" />
      <stop offset="1" stop-color="#121b21" />
    </linearGradient>
    <pattern id="pins-h" width="8" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" width="4" height="14" rx="1" fill="#d5dde1" />
    </pattern>
    <pattern id="pins-v" width="14" height="8" patternUnits="userSpaceOnUse">
      <rect y="2" width="14" height="4" rx="1" fill="#d5dde1" />
    </pattern>
    <pattern id="pins-sm" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect x="1.5" width="3" height="8" rx="0.8" fill="#d5dde1" />
    </pattern>
    <pattern id="vias" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3.2" fill="#0b6d90" />
      <circle cx="10" cy="10" r="1.4" fill="#a8e6f6" />
    </pattern>
    <pattern id="pads" width="16" height="14" patternUnits="userSpaceOnUse">
      <rect x="1" y="3" width="14" height="8" rx="1.5" fill="#e0bd62" />
    </pattern>
    <pattern id="caps" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect x="3" y="2" width="14" height="6" rx="1" fill="#c9b48a" />
      <rect x="3" y="2" width="3" height="6" fill="#dfe6e9" />
      <rect x="14" y="2" width="3" height="6" fill="#dfe6e9" />
    </pattern>
  </defs>

