<!-- Banner texture: seamless circuit-trace tile plus an SMT placement-head
     silhouette (stand-in for the mockup's machine photo). Sits under the
     banner's gradient overlay. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c7aa1" />
      <stop offset="1" stop-color="#1aa6cf" />
    </linearGradient>
    <pattern id="traces" width="240" height="240" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 40h60l30 30h60l30-30h60" />
        <path d="M0 120h40l40 40h80l40-40h40" />
        <path d="M120 0v30l30 30v120l-30 30v30" />
        <path d="M30 0v90l20 20v60" />
        <path d="M240 200h-40l-20 20v20" />
        <path d="M180 0v20l20 20" />
        <path d="M60 240v-30l-20-20H0" />
        <path d="M210 120v-30l20-20h10" />
      </g>
      <g fill="#ffffff" fill-opacity="0.32">
        <circle cx="50" cy="170" r="4" />
        <circle cx="180" cy="220" r="4" />
        <circle cx="200" cy="40" r="4" />
        <circle cx="210" cy="120" r="4" />
        <circle cx="90" cy="70" r="3" />
        <circle cx="80" cy="160" r="3" />
      </g>
    </pattern>
    <radialGradient id="glow" cx="0.8" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <rect width="1440" height="560" fill="url(#bg)" />
  <rect width="1440" height="560" fill="url(#traces)" />

  <g fill="url(#head)">
    <rect x="1050" y="-20" width="200" height="230" rx="16" />
    <rect x="1110" y="210" width="80" height="120" rx="10" />
    <rect x="1132" y="330" width="36" height="70" rx="6" />
    <path d="M1138 400h24l-6 64h-12Z" />
  </g>
  <rect x="980" y="470" width="420" height="18" rx="9" fill="#ffffff" fill-opacity="0.14" />

  <rect width="1440" height="560" fill="url(#glow)" />
</svg>
